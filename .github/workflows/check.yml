# Quick safety check on pull requests: runs the site's tests, checks the AWS
# setup compiles, and builds the container. It does not touch AWS.
name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A throwaway PostgreSQL 16 (same major version as on AWS). The runner
      # has it installed already, so nothing is downloaded from Docker Hub
      # (which limits how often GitHub's machines may pull from it).
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "alter user postgres password 'test'"
          sudo -u postgres createdb social_test
      - run: npm ci --no-audit --no-fund
      - name: Run the site's tests
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/social_test
      - name: Download the site's base image (with fallbacks)
        run: .github/scripts/fetch-base-image.sh
      - name: Build the site's container
        run: docker build -t local-social .

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Check the AWS code compiles
        run: npm run build
